<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="js/menu.js" defer></script>
    <title>Démo pour menu réactif accessible</title>
  </head>
  <body>
    <header>
      <nav class="nav-menu" aria-label="Navigation principale">
        <!-- Bouton Menu / Fermer -->
        <button
          class="nav-menu__toggle"
          aria-expanded="false"
          aria-controls="nav-menu-list"
          aria-label="Ouvrir le menu de navigation"
        >
          <!-- L'icône doit être positionnée en premier pour le sélecteur CSS adjacent (+) -->
          <span class="nav-menu__hamburger-icon" aria-hidden="true"></span>
          <span class="nav-menu__libelle">Menu</span>
        </button>

        <!-- Liste des liens de navigation -->
        <ul id="nav-menu-list" class="nav-menu__list">
          <li class="nav-menu__item">
            <a href="#home" class="nav-menu__link">Accueil</a>
          </li>
          <li class="nav-menu__item">
            <a href="#services" class="nav-menu__link">Services</a>
          </li>
          <li class="nav-menu__item">
            <a href="#about" class="nav-menu__link">À propos</a>
          </li>
          <li class="nav-menu__item">
            <a href="#contact" class="nav-menu__link">Contact</a>
          </li>
        </ul>
      </nav>
    </header>
    <main>
      <h1>Titre projet</h1>
    </main>
  </body>
</html>
