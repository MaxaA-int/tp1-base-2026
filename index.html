<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="js/menu.js" defer></script>
    <title>Catalogue - Foulée</title>
  </head>
  <body>
    <header class="header">
      <nav class="nav flex">
        <h2 class="nav__titre">Foulée</h2>

        <div class="nav__categories">
          <ul class="menu flex">
            <li class="menu__item">
              <a href="" class="menu__lien">Hommes</a>
            </li>

            <li class="menu__item">
              <a href="" class="menu__lien">Femmes</a>
            </li>

            <li class="menu__item">
              <a href="" class="menu__lien">Enfants</a>
            </li>

            <li class="menu__item">
              <a href="" class="menu__lien">Sport</a>
            </li>

            <li class="menu__item">
              <a href="" class="menu__lien">Personnaliser</a>
            </li>

            <li class="menu__item">
              <a href="" class="menu__lien">Foulée+</a>
            </li>
          </ul>
        </div>

        <div class="nav__utilitaire flex">
          <div class="rechercher">
            <input
              name="search"
              id="search"
              class="screen-reader-only"
              title="Espace pour recherhcer un article"
            />
            <label for="search" class="flex">
              <p class="search__texte">Rechercher</p>
              <img src="img/Loupe.svg" alt="Zone Search" />
            </label>
          </div>

          <div class="panier">
            <img src="img/Panier.svg" alt="Panier" />
          </div>
        </div>
      </nav>
    </header>

    <main class="main">
      <div class="main__entete entete">
        <div class="fil-arianne">
          <a href="" class="fil-arriane__link"> Accueil </a>
          <a href="" class="fil-arriane__link"> Chaussure </a>
        </div>

        <h1 class="entete__titre">Chaussure</h1>

        <div class="entete__nombre-produits nombre-produits">
          <span id="nombre-produits">12</span>
          <span>produits</span>
        </div>

        <div class="entete__categories categories">
          <ul class="categories">

            <li class="categories__item">
              <p>
                <button
                  name="btnTous"
                  id="btnTous"
                  value="Tous"
                  title="Bouton pour le filtre 'Tous'"
                >
                  <label for="btnTous">
                    <a href="">Tous</a>
                  </label>
                </button>
              </p>
            </li>

            <li class="categories__item">
              <p>
                <button
                  name="btnHommes"
                  id="btnHommes"
                  value="Hommes"
                  title="Bouton pour le filtre 'Hommes'"
                >
                  <label for="btnHommes">
                    <a href="">Hommes</a>
                  </label>
                </button>
              </p>
            </li>

            <li class="categories__item">
              <p>
                <button
                  name="btnFemmes"
                  id="btnFemmes"
                  value="Femmes"
                  title="Bouton pour le filtre 'Femmes'"
                >
                  <label for="btnFemmes">
                    <a href="">Femmes</a>
                  </label>
                </button>
              </p>
            </li>

            <li class="categories__item">
              <p>
                <button
                  name="btnEnfant"
                  id="btnEnfant"
                  value="Enfant"
                  title="Bouton pour le filtre 'Enfant'"
                >
                  <label for="btnEnfant">
                    <a href="">Enfant</a>
                  </label>
                </button>
              </p>
            </li>

          </ul>
        </div>

      </div>
    </main>
  </body>
</html>
