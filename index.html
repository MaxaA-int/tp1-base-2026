<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="js/menu.js" defer></script>
    <title>Catalogue - Foulée</title>
  </head>
  <body>
    <header class="header">
      <nav class="nav flex">
        <h2 class="nav__titre">Foulée</h2>

        <div class="nav__categories">
          <ul class="menu flex">
            <li class="menu__item">
              <a href="" class="menu__lien">Hommes</a>
            </li>

            <li class="menu__item">
              <a href="" class="menu__lien">Femmes</a>
            </li>

            <li class="menu__item">
              <a href="" class="menu__lien">Enfants</a>
            </li>

            <li class="menu__item">
              <a href="" class="menu__lien">Sport</a>
            </li>

            <li class="menu__item">
              <a href="" class="menu__lien">Personnaliser</a>
            </li>

            <li class="menu__item">
              <a href="" class="menu__lien">Foulée+</a>
            </li>
          </ul>
        </div>

        <div class="nav__utilitaire flex">
          <div class="rechercher">
            <input
              name="search"
              id="search"
              class="screen-reader-only"
              title="Espace pour recherhcer un article"
            />
            <label for="search" class="flex">
              <p class="search__texte">Rechercher</p>
              <img src="img/Loupe.svg" alt="Zone Search" />
            </label>
          </div>

          <div class="panier">
            <img src="img/Panier.svg" alt="Panier" />
          </div>
        </div>
      </nav>
    </header>

    <main class="main">
      <div class="main__entete entete">
        <div class="entete__fil-arianne fil-arianne">
          <a href="" class="fil-arriane__link copyright"> Accueil </a>
          <a href="" class="fil-arriane__link copyright"> Chaussure </a>
        </div>

        <h1 class="entete__titre">Chaussure</h1>

        <div class="entete__nombre-produits nombre-produits">
          <span id="nombre-produits">12</span>
          <span>produits</span>
        </div>

        <div class="entete__categories categories">
          <ul class="categories__liste flex">
            <li class="categories__item">
              <p>
                <button
                  name="btnTous"
                  id="btnTous"
                  value="Tous"
                  title="Bouton pour le filtre 'Tous'"
                >
                  <label for="btnTous">
                    <a href="">Tous</a>
                  </label>
                </button>
              </p>
            </li>

            <li class="categories__item">
              <p>
                <button
                  name="btnHommes"
                  id="btnHommes"
                  value="Hommes"
                  title="Bouton pour le filtre 'Hommes'"
                >
                  <label for="btnHommes">
                    <a href="">Hommes</a>
                  </label>
                </button>
              </p>
            </li>

            <li class="categories__item">
              <p>
                <button
                  name="btnFemmes"
                  id="btnFemmes"
                  value="Femmes"
                  title="Bouton pour le filtre 'Femmes'"
                >
                  <label for="btnFemmes">
                    <a href="">Femmes</a>
                  </label>
                </button>
              </p>
            </li>

            <li class="categories__item">
              <p>
                <button
                  name="btnEnfant"
                  id="btnEnfant"
                  value="Enfant"
                  title="Bouton pour le filtre 'Enfant'"
                >
                  <label for="btnEnfant">
                    <a href="">Enfant</a>
                  </label>
                </button>
              </p>
            </li>
          </ul>
        </div>
      </div>
      <div class="main__filtres filtres">
        <div class="filtres__containeur flex">
          <div class="filtres__affichage">
            <input
              name="filtres-gen"
              id="filtres-gen"
              class="screen-reader-only"
              title="Boutons pour masquer ou afficher les filtres généraux"
            />
            <label for="filtres-gen" class="flex">
              <img src="img/Icone-filtre01.svg" alt="Zone Search" />
              <h4 class="filtres-gen__texte">Masquer les filtres</h4>
            </label>
          </div>
          <div class="filtres__secondaires">
            <p>
              <label for="filtres-sec">Trier Par</label>
              <select name="filtres-sec" id="filtres-sec">
                <option value="nouv">Nouveautés</option>
                <option value="ancien">Anciennetés</option>
                <option value="popul">Popularité</option>
              </select>
            </p>
          </div>
        </div>
      </div>
      <div class="main__contenus contenus">
        <div class="contenus__filtres preferences">
          <div class="preferences__item">
            <div class="preferences__titre flex">
              <h4 class="">Sports</h4>
              <div class="preferences__cacher">
                <input
                  name="cacher-sport"
                  id="cacher-sport"
                  class="screen-reader-only"
                  title="Bouton pour cacher la section 'Sports'"
                />
                <label for="cacher-sport" class="">
                  <p class="cacher-sport__texte">-</p>
                </label>
              </div>
            </div>
            <ul class="preferences__liste">
              <li class="preferences__item">
                <input
                  type="checkbox"
                  name="course"
                  value="course"
                  id="course"
                />
                <label for="course">Course</label>
              </li>
              <li class="preferences__item">
                <input
                  type="checkbox"
                  name="basketball"
                  value="basketball"
                  id="basketball"
                />
                <label for="basketball">Basketball</label>
              </li>
              <li class="preferences__item">
                <input
                  type="checkbox"
                  name="football"
                  value="football"
                  id="football"
                />
                <label for="football">Football</label>
              </li>
              <li class="preferences__item">
                <input
                  type="checkbox"
                  name="training"
                  value="training"
                  id="training"
                />
                <label for="training">Training</label>
              </li>
              <li class="preferences__item">
                <input
                  type="checkbox"
                  name="lifestyle"
                  value="lifestyle"
                  id="lifestyle"
                />
                <label for="lifestyle">Lifestyle</label>
              </li>
            </ul>
          </div>
        </div>
        <div class="contenus__collection collection"></div>
      </div>
    </main>
  </body>
</html>
